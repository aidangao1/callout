[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callout"
version = "0.2.3"
description = "Voice-command order entry for Interactive Brokers futures (buy ES / sell ES / flatten)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Aidan Gao" }]
dependencies = [
  "ib_async>=2.0",
  "vosk>=0.3.45",
  "sounddevice>=0.4.6",
  "pynput>=1.7.6",
  "pyttsx3>=2.90; sys_platform != 'darwin'",
  "comtypes>=1.2; sys_platform == 'win32'",
  "tomli-w>=1.0",
  "pywebview>=5.0,<7",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
callout = "callout.cli:main"

[tool.setuptools.packages.find]
include = ["callout*"]

[tool.setuptools.package-data]
callout = ["config_template.toml", "app/web/*", "app/web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "UP042",   # keep Action(str, Enum): StrEnum would change how actions print in logs
  "SIM105",  # try/except/pass reads fine for "best effort" cleanup
]

[tool.ruff.lint.isort]
known-first-party = ["callout", "helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # some tests import after pytest.importorskip
